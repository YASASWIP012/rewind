[project]
name = "rewind-bench"
version = "0.1.0"
description = "Benchmark harness for Rewind: record, fork, replay and score briefing agents through the gateway."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
